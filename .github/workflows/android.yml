name: Android Build V12
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 36 / Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        env:
          FIXED_BACKEND_URL: ${{ secrets.FIXED_BACKEND_URL }}
          FIXED_BACKEND_KEY: ${{ secrets.FIXED_BACKEND_KEY }}
          FIXED_TELEGRAM_CHAT_ID: ${{ secrets.FIXED_TELEGRAM_CHAT_ID }}
        run: chmod +x gradlew && ./gradlew --no-daemon clean assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smsforwarder-android16-v12-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
