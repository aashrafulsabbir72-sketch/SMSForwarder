plugins {
    id 'com.android.application'
}
android {
    namespace 'com.aashraful.smsforwarder'
    compileSdk 36
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.aashraful.smsforwarder2"
        minSdk 21
        targetSdk 36
        versionCode 12
        versionName "2.0-v12"
        buildConfigField "String", "FIXED_BACKEND_URL", "\"${System.getenv('FIXED_BACKEND_URL') ?: ''}\""
        buildConfigField "String", "FIXED_BACKEND_KEY", "\"${System.getenv('FIXED_BACKEND_KEY') ?: ''}\""
        buildConfigField "String", "FIXED_TELEGRAM_CHAT_ID", "\"${System.getenv('FIXED_TELEGRAM_CHAT_ID') ?: ''}\""
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
